.tab.active{background:#FFFEFC;color:#1D2538}
.search,.select{background:#FFFEFC;border-color:var(--line)}
.empty{background:#FBF9F5;border-color:#D9D4CE}
.week-day.today{background:#EFE5D5;border-color:#CDB487}
.timer-modes{background:#E9E4DB}
.timer-mode{color:#647083}
.timer-mode.active{background:#34445B;color:#fff}
.timer-ring{background:conic-gradient(#B59A6D var(--progress),#E5DFD5 0)}
.timer-core{background:#FFFEFC}
.timer-aside .tip-card{background:#EAE5DD;color:#556175}
.timer-aside .tip-card strong{color:#34445B}
.notice{background:#FBF4E6;border-color:#E6D8BE;color:#796241}
.notice button{color:#796241}
.overlay{background:#172033b0}
.modal{background:#FFFEFC}
.field label{color:#34445B}
.field input,.field select{background:#FFFEFC;border-color:#D9D4CE}
.field input:focus,.field select:focus{outline-color:#EAE0CF;border-color:#B59A6D}
.color-choice{border-color:#FFFEFC;box-shadow:0 0 0 1px #CFC6B7}
.color-choice.selected{box-shadow:0 0 0 2px #34445B}
.toast{background:#1D2538}
.footer-note{display:flex;align-items:center;justify-content:center;gap:6px;flex-direction:column;border-top:1px solid #DED9D1;padding-top:20px;margin-top:34px;color:#797D83;font-size:11px}
.footer-brand{color:#34445B;font-weight:800;font-size:12px}
.footer-brand span{color:#B59A6D;margin:0 5px}
.footer-credit{color:#515766;letter-spacing:.2px;font-size:12px}
.footer-credit strong{color:#1D2538;font-weight:900}
.footer-info{color:#868780}
@media(max-width:920px){
 .mobile-brand{display:flex;align-items:center;gap:10px;max-width:430px;margin:-7px 0 18px;padding:7px 10px;background:#FFFEFC;border:1px solid #E5DDD0;border-radius:15px;box-shadow:0 4px 14px #1D253807}
 .mobile-brand img{display:block;width:91px;height:69px;object-fit:contain;border-radius:10px;background:#FBF7F0}
 .mobile-brand>div{display:flex;flex-direction:column;gap:1px}
 .mobile-brand strong{font-size:19px;font-weight:900;letter-spacing:.15px;color:#1D2538}
 .mobile-brand span{font-size:12px;color:#737A7F}
 .mobile-nav{background:#FFFEFCf5;border-color:#DED9D1}
 .mobile-item{color:#667080}
 .mobile-item.active{color:#1D2538;background:#EAE5DD}
}
@media(max-width:700px){
 .mobile-brand{margin-top:-9px}
 .hero{background:linear-gradient(135deg,#1D2538,#34445B)}
}

</style>

function dateText(s){return s?new Intl.DateTimeFormat('ar-QA',{day:'numeric',month:'short'}).format(parseDate(s)):'بلا موعد'}

function initialData(){const ids=[uid(),uid(),uid()];return {subjects:[{id:ids[0],name:'اللغة العربية',color:COLORS[0]},{id:ids[1],name:'الرياضيات',color:COLORS[1]},{id:ids[2],name:'اللغة الإنجليزية',color:COLORS[2]}],tasks:[{id:uid(),title:'مراجعة درس النحو',subjectId:ids[0],due:shiftDate(0),minutes:30,priority:'high',done:false},{id:uid(),title:'حل مسائل الفصل الثاني',subjectId:ids[1],due:shiftDate(0),minutes:45,priority:'medium',done:false},{id:uid(),title:'حفظ عشر كلمات جديدة',subjectId:ids[2],due:shiftDate(1),minutes:20,priority:'low',done:false},{id:uid(),title:'قراءة نص أدبي',subjectId:ids[0],due:shiftDate(2),minutes:30,priority:'medium',done:true},{id:uid(),title:'تدريب على المعادلات',subjectId:ids[1],due:shiftDate(3),minutes:40,priority:'low',done:false}],focusSessions:0,focusMinutes:0,showDemoNotice:true};}
let storageEnabled=true;let data;
try{const saved=localStorage.getItem(KEY)||localStorage.getItem(LEGACY_KEY);data=saved?JSON.parse(saved):initialData();if(!localStorage.getItem(KEY))localStorage.setItem(KEY,JSON.stringify(data));}catch(e){data=initialData();storageEnabled=false}
if(!data||!Array.isArray(data.subjects)||!Array.isArray(data.tasks))data=initialData();
data.focusSessions=Number(data.focusSessions)||0;data.focusMinutes=Number(data.focusMinutes)||0;const priorPalette={'#7360eb':COLORS[0],'#2aafb0':COLORS[1],'#ef9b4a':COLORS[2],'#e16d9d':COLORS[3],'#5796e9':COLORS[4],'#8c78aa':COLORS[5]};let paletteChanged=false;data.subjects.forEach(s=>{if(priorPalette[String(s.color).toLowerCase()]){s.color=priorPalette[String(s.color).toLowerCase()];paletteChanged=true}});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));storageEnabled=true}catch(e){storageEnabled=false;toast('تعذر حفظ البيانات: تحقق من إعدادات التخزين في المتصفح')}};
if(paletteChanged){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){storageEnabled=false}}
let view='dashboard',taskFilter='all',subjectFilter='all',searchTerm='',selectedColor=COLORS[0],editTaskId=null,toastTimer,modalFocusReturn=null;
let timerMode='focus',timerSeconds=25*60,timerRunning=false,timerEnd=0,timerTick=null;
const durations={focus:25*60,long:50*60,break:5*60};
const completed=()=>data.tasks.filter(t=>t.done).length;
const ratio=()=>data.tasks.length?Math.round(completed()*100/data.tasks.length):0;
const subjectById=id=>data.subjects.find(s=>s.id===id);
const stats=()=>[{label:'المواد الدراسية',val:data.subjects.length,icon:'book',tone:'purple'},{label:'إجمالي المهام',val:data.tasks.length,icon:'check',tone:'blue'},{label:'مهام مكتملة',val:completed(),icon:'spark',tone:'green'},{label:'نسبة الإنجاز',val:ratio()+'%',icon:'chart',tone:'orange'}];
function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2900)}
function topbar(title,subtitle){return `<header class="topbar"><div><p class="eyebrow">${escapeHTML(subtitle)}</p><h1 class="heading">${escapeHTML(title)}</h1></div><div class="date-pill">${icon('calendar',16)}<span>${escapeHTML(fullToday())}</span></div></header>`}
function empty(message,desc=''){return `<div class="empty"><span class="empty-icon">📚</span><strong>${escapeHTML(message)}</strong><p>${escapeHTML(desc)}</p></div>`}
function taskHTML(t,withActions=false){const s=subjectById(t.subjectId);const overdue=t.due&&!t.done&&t.due<localDate();const label=t.due===localDate()?'اليوم':overdue?'متأخرة: '+dateText(t.due):dateText(t.due);return `<article class="task-card ${t.done?'done':''}"><input type="checkbox" class="task-check" data-task-check="${escapeHTML(t.id)}" aria-label="إكمال مهمة ${escapeHTML(t.title)}" ${t.done?'checked':''}><div class="task-body"><h3 class="task-name">${escapeHTML(t.title)}</h3><div class="task-meta"><span><span class="dot" style="background:${s?.color||'#bbb'}"></span>${escapeHTML(s?.name||'مادة محذوفة')}</span><span class="task-date ${overdue?'overdue':''}">${icon('calendar',12)} ${escapeHTML(label)}</span><span>${icon('clock',12)} ${Number(t.minutes)||25} دقيقة</span></div></div><span class="priority ${['high','medium','low'].includes(t.priority)?t.priority:'low'}">${t.priority==='high'?'عالية':t.priority==='medium'?'متوسطة':'عادية'}</span>${withActions?`<div class="card-actions"><button class="icon-btn" title="تعديل المهمة" aria-label="تعديل المهمة" data-edit-task="${escapeHTML(t.id)}">${icon('pencil',16)}</button><button class="icon-btn danger" title="حذف المهمة" aria-label="حذف المهمة" data-delete-task="${escapeHTML(t.id)}">${icon('trash',16)}</button></div>`:''}</article>`}
const orderTasks=(a,b)=>Number(a.done)-Number(b.done)||(a.due||'9999').localeCompare(b.due||'9999');
function dashboard(){const today=localDate(),todayTasks=data.tasks.filter(t=>!t.done&&(!t.due||t.due<=today)).sort(orderTasks).slice(0,5);let subprogress=data.subjects.slice(0,5).map(s=>{const tasks=data.tasks.filter(t=>t.subjectId===s.id),d=tasks.filter(t=>t.done).length,p=tasks.length?Math.round(d*100/tasks.length):0;return `<div><div class="subject-head"><span class="subject-name"><span class="dot" style="background:${s.color}"></span>${escapeHTML(s.name)}</span><span class="subject-ratio">${p}%</span></div><div class="track"><div class="fill" style="background:${s.color};width:${p}%"></div></div></div>`}).join('');const greeting=new Date().getHours()<12?'صباح الخير':'مساء الخير';return topbar(greeting+' 👋','لوحة تحكمك الدراسية')+`${data.showDemoNotice?`<div class="notice"><span>هذه بيانات نموذجية لتجربة الموقع. يمكنك تعديلها أو حذفها وإضافة موادك ومهامك.</span><div class="notice-actions"><button class="demo-clear" data-clear-demo>بدء من الصفر</button><button data-dismiss-notice aria-label="إغلاق التنبيه">×</button></div></div>`:''}<section class="hero"><div class="hero-copy"><p class="hero-kicker">✨ خُطوة كل يوم</p><h2>نظّم وقتك، واصنع إنجازك.</h2><p>تابع دروسك وأنجز مهامك الدراسية بخطوات بسيطة وواضحة.</p><div class="btn-row"><button class="btn btn-white" data-add-task>${icon('plus',17)} إضافة مهمة</button><button class="btn btn-ghost-white" data-view="timer">${icon('clock',17)} ابدأ التركيز</button></div></div><div class="hero-art" aria-hidden="true"><div class="hero-halo"><div class="hero-inner"><div><b>${ratio()}%</b><small>إنجازك</small></div></div></div></div></section><div class="stats">${stats().map(s=>`<div class="stat-card"><div><div class="stat-label">${s.label}</div><div class="stat-value">${s.val}</div></div><div class="stat-icon ${s.tone}">${icon(s.icon,24)}</div></div>`).join('')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-header"><div><h2>📌 المهام المطلوبة الآن</h2><p class="section-subtitle">مهام اليوم وأي مهام لم تنجز من قبل</p></div><button class="link-btn" data-view="tasks">عرض الكل</button></div><div class="task-list">${todayTasks.length?todayTasks.map(t=>taskHTML(t)).join(''):empty('أحسنت! لا توجد مهام متأخرة أو مطلوبة اليوم','أضف مهمة جديدة أو استمتع بوقت الراحة.')}</div></section><section class="panel"><div class="panel-header"><div><h2>📊 تقدم المواد</h2><p class="section-subtitle">نسبة المهام المكتملة في كل مادة</p></div><button class="link-btn" data-view="subjects">المواد</button></div><div class="subject-progress">${subprogress||empty('لم تُضف مواد بعد','أضف أول مادة لعرض تقدمها.')}</div><div class="quick-tip">💡 تقسيم المادة إلى مهام صغيرة يساعدك على متابعة تقدمك بدقة.</div></section></div>${weekHTML()}`}
function weekHTML(){const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);const day=localDate(d);const count=data.tasks.filter(t=>t.due===day&&!t.done).length;return `<div class="week-day ${i===0?'today':''}"><b>${new Intl.DateTimeFormat('ar-QA',{weekday:'short'}).format(d)}</b><strong>${d.getDate()}</strong><small>${count?count+' مهام':'لا مهام'}</small></div>`}).join('');return `<section class="mini-week"><div class="panel-header"><div><h2 style="margin:0;font-size:16px">🗓️ الأيام السبعة القادمة</h2><p class="section-subtitle">عدد المهام غير المكتملة حسب تاريخ التسليم</p></div></div><div class="week-items">${days}</div></section>`}
function subjectsPage(){return topbar('موادي الدراسية','نظّم موادك واستعرض تقدمك')+`<div class="page-header"><div><h2 class="section-title">المواد الدراسية</h2><p class="section-lead">أضف موادك ثم اربط بكل مادة مهامًا تريد إنجازها.</p></div><button class="btn btn-primary" data-add-subject>${icon('plus',18)} إضافة مادة</button></div><div class="subjects-grid">${data.subjects.length?data.subjects.map(s=>{const tasks=data.tasks.filter(t=>t.subjectId===s.id),done=tasks.filter(t=>t.done).length,p=tasks.length?Math.round(done*100/tasks.length):0;return `<article class="subject-card"><div class="subject-top"><div class="subject-icon" style="background:${s.color}">${icon('book',23)}</div><button class="icon-btn danger" data-delete-subject="${escapeHTML(s.id)}" title="حذف المادة" aria-label="حذف ${escapeHTML(s.name)}">${icon('trash',17)}</button></div><h3>${escapeHTML(s.name)}</h3><p>${done} من ${tasks.length} مهام مكتملة</p><div class="track"><div class="fill" style="background:${s.color};width:${p}%"></div></div><footer><span class="small-muted">${p}% تم إنجازه</span><button class="link-btn" data-show-subject="${escapeHTML(s.id)}">عرض المهام</button></footer></article>`}).join(''):empty('لا توجد مواد دراسية','اضغط على إضافة مادة للبدء.')}</div>`}
function taskListFiltered(){const today=localDate();return data.tasks.filter(t=>{if(subjectFilter!=='all'&&t.subjectId!==subjectFilter)return false;if(searchTerm&&!t.title.toLocaleLowerCase('ar').includes(searchTerm.toLocaleLowerCase('ar')))return false;if(taskFilter==='done')return t.done;if(taskFilter==='today')return !t.done&&t.due===today;if(taskFilter==='upcoming')return !t.done&&t.due>today;return true}).sort(orderTasks)}
function tasksPage(){const filters=[['all','الكل'],['today','اليوم'],['upcoming','القادمة'],['done','مكتملة']];return topbar('قائمة مهامي','جميع مهام المذاكرة في مكان واحد')+`<div class="page-header"><div><h2 class="section-title">مهام المذاكرة</h2><p class="section-lead">أنجز مهامك بالترتيب الذي يناسب وقتك.</p></div><button class="btn btn-primary" data-add-task>${icon('plus',18)} مهمة جديدة</button></div><div class="toolbar"><div class="tabs">${filters.map(([v,label])=>`<button class="tab ${taskFilter===v?'active':''}" data-filter="${v}">${label}</button>`).join('')}</div><label class="search">${icon('book',16)}<input id="task-search" placeholder="ابحث عن مهمة..." value="${escapeHTML(searchTerm)}" autocomplete="off" aria-label="بحث في المهام"></label><select class="select" id="subject-filter" aria-label="تصفية حسب المادة"><option value="all">جميع المواد</option>${data.subjects.map(s=>`<option value="${escapeHTML(s.id)}" ${subjectFilter===s.id?'selected':''}>${escapeHTML(s.name)}</option>`).join('')}</select></div><section class="all-tasks"><div class="panel-header"><h2>المهام (${taskListFiltered().length})</h2><span class="small-muted">اضغط على المربع لتحديد إنجاز المهمة</span></div><div class="task-list" id="filtered-tasks">${taskListFiltered().length?taskListFiltered().map(t=>taskHTML(t,true)).join(''):empty('لا توجد مهام في هذا القسم','جرّب تغيير التصفية أو إضافة مهمة جديدة.')}</div></section>`}
function timerPage(){return topbar('مؤقت التركيز','جلسة واحدة في كل مرة')+`<div class="page-header"><div><h2 class="section-title">وقت المذاكرة ⏱️</h2><p class="section-lead">اختر مدة الجلسة وابدأ التركيز بعيدًا عن المشتتات.</p></div></div><div class="timer-layout"><section class="timer-box"><div class="timer-modes"><button class="timer-mode ${timerMode==='focus'?'active':''}" data-timer-mode="focus">تركيز 25 دقيقة</button><button class="timer-mode ${timerMode==='long'?'active':''}" data-timer-mode="long">تركيز 50 دقيقة</button><button class="timer-mode ${timerMode==='break'?'active':''}" data-timer-mode="break">استراحة 5 دقائق</button></div><div class="timer-ring" id="timer-ring"><div class="timer-core"><span class="timer-time" id="timer-display">25:00</span><span class="timer-caption" id="timer-caption">جلسة تركيز</span></div></div><div class="timer-controls"><button class="btn btn-primary" id="timer-toggle">${icon('play',17)} بدء الجلسة</button><button class="btn btn-neutral" id="timer-reset">${icon('reset',17)} إعادة التوقيت</button></div></section><aside class="timer-aside"><div class="panel"><h2 style="font-size:16px;margin:0">إنجازات التركيز</h2><p class="section-subtitle">تُحسب بعد اكتمال الجلسة فقط</p><div class="focus-stats"><div class="focus-stat"><b>${data.focusSessions}</b><span>جلسات مكتملة</span></div><div class="focus-stat"><b>${data.focusMinutes}</b><span>دقائق تركيز</span></div></div><div class="tip-card"><strong>☕ طريقة مقترحة</strong><p>ذاكر لمدة 25 دقيقة، ثم خذ استراحة قصيرة لمدة 5 دقائق. كرّر حسب حاجتك.</p></div></div><div class="panel" style="margin-top:18px"><h2 style="font-size:15px;margin:0">نصائح للتركيز</h2><ul class="tip-list"><li>ضع الهاتف بعيدًا أثناء الجلسة.</li><li>حدّد مهمة واحدة قبل بدء المؤقت.</li><li>ابقِ الصفحة مفتوحة أثناء العد التنازلي.</li></ul></div></aside></div>`}
function render(){const root=$('#view-root');root.innerHTML=({dashboard,subjects:subjectsPage,tasks:tasksPage,timer:timerPage}[view]||dashboard)();document.querySelectorAll('[data-view]').forEach(el=>{const on=el.dataset.view===view;el.classList.toggle('active',on);if(on)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});if(view==='timer')updateTimerUI()}
function navigate(v){if(!['dashboard','subjects','tasks','timer'].includes(v))return;view=v;render();window.scrollTo({top:0,behavior:'instant'})}
function openModal(html){modalFocusReturn=document.activeElement;$('#modal-dialog').innerHTML=html;$('#modal-overlay').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>$('#modal-dialog input, #modal-dialog select, #modal-dialog button')?.focus(),0)}
function closeModal(){$('#modal-overlay').classList.remove('open');$('#modal-dialog').innerHTML='';document.body.style.overflow='';modalFocusReturn?.focus?.()}
function subjectModal(){selectedColor=COLORS[data.subjects.length%COLORS.length];openModal(`<div class="modal-head"><h2 id="modal-title">إضافة مادة دراسية</h2><button type="button" class="icon-btn modal-close" data-close-modal aria-label="إغلاق">×</button></div><form id="subject-form"><div class="field"><label for="subject-name">اسم المادة *</label><input id="subject-name" name="name" maxlength="55" placeholder="مثال: الفيزياء" required></div><div class="field"><label>اختر لون المادة</label><div class="colors">${COLORS.map(c=>`<button class="color-choice ${c===selectedColor?'selected':''}" type="button" data-color="${c}" aria-label="اختيار لون" aria-pressed="${c===selectedColor}" style="background:${c}"></button>`).join('')}</div></div><div class="form-footer"><button type="button" class="btn btn-neutral" data-close-modal>إلغاء</button><button type="submit" class="btn btn-primary">حفظ المادة</button></div></form>`)}
function taskModal(id=null){if(!data.subjects.length){toast('أضف مادة دراسية أولًا');subjectModal();return}editTaskId=id;const t=id?data.tasks.find(x=>x.id===id):null;openModal(`<div class="modal-head"><h2 id="modal-title">${t?'تعديل المهمة':'إضافة مهمة جديدة'}</h2><button type="button" class="icon-btn modal-close" data-close-modal aria-label="إغلاق">×</button></div><form id="task-form"><div class="field"><label for="task-title">عنوان المهمة *</label><input id="task-title" maxlength="100" required value="${escapeHTML(t?.title||'')}" placeholder="مثال: مراجعة الفصل الأول"></div><div class="field"><label for="task-subject">المادة الدراسية *</label><select id="task-subject" required>${data.subjects.map(s=>`<option value="${escapeHTML(s.id)}" ${t?.subjectId===s.id?'selected':''}>${escapeHTML(s.name)}</option>`).join('')}</select></div><div class="field-row"><div class="field"><label for="task-due">تاريخ التسليم</label><input id="task-due" type="date" value="${escapeHTML(t?.due||localDate())}"></div><div class="field"><label for="task-minutes">المدة المتوقعة (دقيقة)</label><input id="task-minutes" type="number" min="1" max="600" step="1" value="${Number(t?.minutes)||25}" required></div></div><div class="field"><label for="task-priority">الأولوية</label><select id="task-priority"><option value="low" ${t?.priority==='low'?'selected':''}>عادية</option><option value="medium" ${t?.priority==='medium'||!t?'selected':''}>متوسطة</option><option value="high" ${t?.priority==='high'?'selected':''}>عالية</option></select></div><div class="form-footer"><button type="button" class="btn btn-neutral" data-close-modal>إلغاء</button><button type="submit" class="btn btn-primary">${t?'حفظ التعديل':'إضافة المهمة'}</button></div></form>`)}
function deleteTask(id){const t=data.tasks.find(t=>t.id===id);if(!t)return;if(!confirm(`هل تريد حذف المهمة «${t.title}»؟`))return;data.tasks=data.tasks.filter(t=>t.id!==id);save();render();toast('تم حذف المهمة')}
function deleteSubject(id){const s=subjectById(id);if(!s)return;const count=data.tasks.filter(t=>t.subjectId===id).length;if(!confirm(`حذف مادة «${s.name}»؟ سيتم حذف ${count} مهمة مرتبطة بها أيضًا.`))return;data.subjects=data.subjects.filter(x=>x.id!==id);data.tasks=data.tasks.filter(t=>t.subjectId!==id);if(subjectFilter===id)subjectFilter='all';save();render();toast('تم حذف المادة والمهام المرتبطة بها')}
function refreshAfterTaskChange(){save();render()}
function switchTimerMode(m){if(!Object.hasOwn(durations,m))return;timerMode=m;timerRunning=false;clearInterval(timerTick);timerTick=null;timerSeconds=durations[m];timerEnd=0;render()}
function updateTimerUI(){if(timerRunning)timerSeconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));const el=$('#timer-display');if(!el)return;const mins=Math.floor(timerSeconds/60),secs=timerSeconds%60;el.textContent=`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;$('#timer-ring').style.setProperty('--progress',((durations[timerMode]-timerSeconds)/durations[timerMode]*360)+'deg');$('#timer-caption').textContent=timerMode==='break'?'وقت الاستراحة':'جلسة تركيز';const btn=$('#timer-toggle');btn.innerHTML=timerRunning?`${icon('pause',17)} إيقاف مؤقت`:`${icon('play',17)} ${(timerSeconds===durations[timerMode]||timerSeconds===0)?'بدء الجلسة':'متابعة الجلسة'}`;document.title=`${el.textContent} | Enjaz`}
function finishTimer(){clearInterval(timerTick);timerTick=null;timerRunning=false;timerSeconds=0;if(timerMode!=='break'){data.focusSessions++;data.focusMinutes+=durations[timerMode]/60;save()}render();toast(timerMode==='break'?'انتهت الاستراحة، حان وقت المذاكرة!':'أحسنت! اكتملت جلسة التركيز 🎉');try{const ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();const g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=700;g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);o.start();o.stop(ac.currentTime+.25);o.onended=()=>ac.close()}catch(e){}}
function tickTimer(){if(!timerRunning)return;if(Date.now()>=timerEnd){finishTimer();return}updateTimerUI()}
function toggleTimer(){if(timerRunning){timerSeconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerRunning=false;clearInterval(timerTick);timerTick=null}else{if(timerSeconds===0)timerSeconds=durations[timerMode];timerEnd=Date.now()+timerSeconds*1000;timerRunning=true;clearInterval(timerTick);timerTick=setInterval(tickTimer,250)}updateTimerUI()}
function resetTimer(){timerRunning=false;clearInterval(timerTick);timerTick=null;timerSeconds=durations[timerMode];timerEnd=0;updateTimerUI()}
// Event delegation also works after any page redraw.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-view')){navigate(b.dataset.view);return}if(b.hasAttribute('data-add-task')){taskModal();return}if(b.hasAttribute('data-add-subject')){subjectModal();return}if(b.hasAttribute('data-close-modal')){closeModal();return}if(b.hasAttribute('data-color')){selectedColor=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>{const on=x.dataset.color===selectedColor;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',String(on))});return}if(b.hasAttribute('data-edit-task')){taskModal(b.dataset.editTask);return}if(b.hasAttribute('data-delete-task')){deleteTask(b.dataset.deleteTask);return}if(b.hasAttribute('data-delete-subject')){deleteSubject(b.dataset.deleteSubject);return}if(b.hasAttribute('data-show-subject')){subjectFilter=b.dataset.showSubject;taskFilter='all';searchTerm='';navigate('tasks');return}if(b.hasAttribute('data-filter')){taskFilter=b.dataset.filter;render();return}if(b.hasAttribute('data-clear-demo')){if(confirm('سيتم حذف البيانات التجريبية وجميع مهامك الحالية. هل تريد البدء من الصفر؟')){data={subjects:[],tasks:[],focusSessions:0,focusMinutes:0,showDemoNotice:false};taskFilter='all';subjectFilter='all';searchTerm='';save();render();toast('يمكنك الآن إضافة موادك الدراسية')}return}if(b.hasAttribute('data-dismiss-notice')){data.showDemoNotice=false;save();render();return}if(b.hasAttribute('data-timer-mode')){switchTimerMode(b.dataset.timerMode);return}if(b.id==='timer-toggle'){toggleTimer();return}if(b.id==='timer-reset'){resetTimer();return}if(b.id==='reset-data'||b.hasAttribute('data-reset-all')){if(confirm('سيؤدي هذا إلى حذف بياناتك الحالية وإعادة تحميل البيانات التجريبية. هل تريد المتابعة؟')){data=initialData();taskFilter='all';subjectFilter='all';searchTerm='';resetTimer();save();navigate('dashboard');toast('تمت إعادة البيانات التجريبية')}return}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-task-check]')){const task=data.tasks.find(x=>x.id===t.dataset.taskCheck);if(task){task.done=t.checked;refreshAfterTaskChange();toast(t.checked?'أحسنت! أُنجزت المهمة 🎉':'أُعيدت المهمة إلى غير مكتملة')}return}if(t.id==='subject-filter'){subjectFilter=t.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){const pos=e.target.selectionStart;searchTerm=e.target.value;const list=$('#filtered-tasks');const items=taskListFiltered();if(list)list.innerHTML=items.length?items.map(t=>taskHTML(t,true)).join(''):empty('لم نعثر على مهام مطابقة','جرّب كلمة بحث أخرى.');const count=$('.all-tasks .panel-header h2');if(count)count.textContent=`المهام (${items.length})`;e.target.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id==='subject-form'){e.preventDefault();const name=$('#subject-name').value.trim();if(!name)return;if(data.subjects.some(s=>s.name.toLocaleLowerCase('ar')===name.toLocaleLowerCase('ar'))){toast('هذه المادة مضافة بالفعل');return}data.subjects.push({id:uid(),name,color:COLORS.includes(selectedColor)?selectedColor:COLORS[0]});save();closeModal();render();toast('تمت إضافة المادة بنجاح')}else if(e.target.id==='task-form'){e.preventDefault();const title=$('#task-title').value.trim(),subjectId=$('#task-subject').value,due=$('#task-due').value,minutes=Number($('#task-minutes').value),priority=$('#task-priority').value;if(!title||!subjectById(subjectId)||!Number.isInteger(minutes)||minutes<1||minutes>600)return;const payload={title,subjectId,due,minutes,priority};if(editTaskId){const t=data.tasks.find(t=>t.id===editTaskId);if(t)Object.assign(t,payload)}else data.tasks.push({id:uid(),...payload,done:false});save();closeModal();render();toast(editTaskId?'تم حفظ تعديل المهمة':'تمت إضافة المهمة بنجاح');editTaskId=null}});
$('#modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-overlay').classList.contains('open'))closeModal()});document.addEventListener('visibilitychange',()=>{if(timerRunning)tickTimer()});
render();if(!storageEnabled)toast('التخزين المحلي محظور في هذا المتصفح، قد لا تُحفظ تغييراتك');
})();
</script>
</body>
